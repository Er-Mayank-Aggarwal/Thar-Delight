name: Production Build & Lint CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          BETTER_AUTH_SECRET: "ci-dummy-secret-key-32-chars-long!"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_ci_dummy_key"
          RAZORPAY_KEY_SECRET: "ci_dummy_razorpay_secret"
          RAZORPAY_WEBHOOK_SECRET: "ci_dummy_webhook_secret"

